<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Jim Killeen — Photography</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F4F2EC;--panel:#EFEBE2;--ink:#1B1A16;--muted:#7A756A;--hair:#E0DBD0;--select:#E4123A;--shadow:0 1px 2px rgba(27,26,22,.06),0 8px 24px rgba(27,26,22,.10);}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Archivo",system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.45}
.mono{font-family:"Space Mono",ui-monospace,monospace}
.logobar{background:#000;width:100%;padding:12px 18px;display:flex;justify-content:center}
.logobar img{max-width:100%;max-height:226px;width:auto;height:auto;display:block}
.wrap{max-width:1240px;margin:0 auto;padding:0 22px}
/* top nav with hamburger */
.topnav{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--hair)}
.menubtn{appearance:none;display:inline-flex;align-items:center;gap:9px;background:none;border:0;cursor:pointer;color:var(--ink);font-family:"Space Mono",monospace;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;padding:6px 4px}
.menubtn .bars{display:inline-block;width:18px;height:12px;position:relative}
.menubtn .bars i{position:absolute;left:0;right:0;height:2px;background:var(--ink);border-radius:2px}
.menubtn .bars i:nth-child(1){top:0}.menubtn .bars i:nth-child(2){top:5px}.menubtn .bars i:nth-child(3){top:10px}
.crumb{font-family:"Space Mono",monospace;font-size:12.5px;letter-spacing:.04em;color:var(--ink)}
.crumb .sub{color:var(--muted)}
.navcount{margin-left:auto;font-family:"Space Mono",monospace;font-size:11.5px;color:var(--muted);letter-spacing:.05em}
/* drawer + scrim */
.scrim{position:fixed;inset:0;background:rgba(16,15,12,.42);opacity:0;visibility:hidden;transition:opacity .22s;z-index:40}
.scrim.open{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;left:0;bottom:0;width:300px;max-width:84vw;background:var(--paper);border-right:1px solid var(--hair);box-shadow:12px 0 40px rgba(27,26,22,.14);transform:translateX(-102%);transition:transform .24s cubic-bezier(.4,0,.2,1);z-index:41;display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 12px;border-bottom:1px solid var(--hair)}
.drawer-head h2{margin:0;font-family:"Space Mono",monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.drawer-close{appearance:none;background:none;border:0;cursor:pointer;font-size:22px;line-height:1;color:var(--muted);padding:2px 6px}
.drawer-close:hover{color:var(--ink)}
.menu{flex:1 1 auto;overflow-y:auto;padding:8px 0}
.mgroup{border-bottom:1px solid rgba(224,219,208,.6)}
.mrow{display:flex;align-items:stretch}
.mitem{flex:1 1 auto;appearance:none;background:none;border:0;cursor:pointer;text-align:left;font-family:"Archivo",sans-serif;font-size:15px;color:var(--ink);padding:13px 18px;letter-spacing:.01em}
.mitem:hover{background:var(--panel)}
.mgroup.active>.mrow>.mitem{font-weight:700}
.mgroup.active>.mrow>.mitem::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--select);margin-right:9px;vertical-align:middle}
.mtog{appearance:none;background:none;border:0;cursor:pointer;color:var(--muted);width:44px;font-size:12px;display:flex;align-items:center;justify-content:center;transition:transform .18s}
.mtog:hover{color:var(--ink)}
.mgroup.open .mtog{transform:rotate(90deg)}
.msub{max-height:0;overflow:hidden;transition:max-height .24s ease;background:var(--panel)}
.mgroup.open .msub{max-height:340px}
.msubitem{display:block;width:100%;appearance:none;background:none;border:0;cursor:pointer;text-align:left;font-family:"Archivo",sans-serif;font-size:13.5px;color:var(--muted);padding:9px 18px 9px 34px}
.msubitem:hover{color:var(--ink);background:#e7e2d7}
.msubitem.active{color:var(--ink);font-weight:600}
.msubitem.active::before{content:"—  ";color:var(--select)}
.menu-admin{border-top:1px solid var(--hair);padding:10px 0 14px}
.menu-admin .lbl{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:6px 18px 4px}
.menu-admin a{display:block;text-decoration:none;font-size:14px;color:var(--ink);padding:9px 18px}
.menu-admin a:hover{background:var(--panel)}
.menu-admin a::before{content:"›";color:var(--select);margin-right:9px}
/* gallery (unchanged) */
.grid{columns:4 250px;column-gap:16px;padding:16px 0 40px}
figure.card{break-inside:avoid;margin:0 0 16px;position:relative;cursor:pointer;background:var(--panel);border-radius:3px;overflow:hidden;box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s}
figure.card:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(27,26,22,.08),0 16px 34px rgba(27,26,22,.16)}
figure.card img{display:block;width:100%;height:auto;background:var(--hair)}
figcaption{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 11px;background:linear-gradient(to top,rgba(20,19,15,.82),rgba(20,19,15,0));color:#F4F2EC;opacity:0;transition:opacity .2s}
figure.card:hover figcaption{opacity:1}
.cap-title{font-size:13.5px;font-weight:600}.cap-cat{font-family:"Space Mono",monospace;font-size:10.5px;letter-spacing:.06em;color:#d9d4c8}
.lb{position:fixed;inset:0;background:rgba(16,15,12,.96);display:none;z-index:50;align-items:center;justify-content:center;padding:0}
.lb.open{display:flex}
.lb-stage{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
.lb-stage img{max-width:100vw;max-height:100vh;width:auto;height:auto;background:#222;cursor:zoom-out}
.lb-label{position:absolute;left:0;right:0;bottom:0;color:#EDEAE1;padding:20px 22px 16px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;background:linear-gradient(to top,rgba(0,0,0,.72),rgba(0,0,0,0))}
.lb-title{font-size:18px;font-weight:600}.lb-meta{font-family:"Space Mono",monospace;font-size:12px;letter-spacing:.06em;color:#a9a397;margin-top:3px}.lb-meta .sel{color:var(--select)}
.lb-nav{display:flex;gap:8px}
.lb-btn{appearance:none;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.05);color:#EDEAE1;width:42px;height:42px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.lb-btn:hover{background:rgba(255,255,255,.14)}.lb-close{position:absolute;top:18px;right:20px}
footer{border-top:1px solid var(--hair);padding:22px 0 44px;color:var(--muted);font-family:"Space Mono",monospace;font-size:11.5px;letter-spacing:.06em;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
@media (max-width:560px){.logobar{padding:10px 14px}.logobar img{max-height:150px}.grid{columns:2 150px;column-gap:12px}figure.card{margin-bottom:12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<div class="logobar"><img src="assets/LogoBlackBG.jpg" alt="Jim Killeen Photography"></div>
<div class="wrap">
  <div class="topnav">
    <button class="menubtn" id="menubtn" aria-label="Open menu" aria-expanded="false" aria-controls="drawer">
      <span class="bars"><i></i><i></i><i></i></span>Browse
    </button>
    <span class="crumb" id="crumb">All</span>
    <span class="navcount" id="navcount"></span>
  </div>
  <main class="grid" id="grid" aria-label="Photo gallery"></main>
</div>
<footer class="wrap"><span>&copy; Jim Killeen &mdash; All rights reserved</span><span id="fcount"></span></footer>

<div class="scrim" id="scrim"></div>
<nav class="drawer" id="drawer" aria-label="Categories" aria-hidden="true">
  <div class="drawer-head"><h2>Browse</h2><button class="drawer-close" id="drawerClose" aria-label="Close menu">&times;</button></div>
  <div class="menu" id="menu"></div>
  <div class="menu-admin" id="menuAdmin" hidden>
    <div class="lbl">Manage</div>
    <a href="admin.html">Admin &mdash; add photos</a>
    <a href="manage.html">Manage &mdash; edit gallery</a>
  </div>
</nav>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="lb-btn lb-close" id="lbClose" aria-label="Close">&times;</button>
  <div class="lb-stage"><img id="lbImg" alt=""></div>
  <div class="lb-label"><div><div class="lb-title" id="lbTitle"></div><div class="lb-meta" id="lbMeta"></div></div>
  <div class="lb-nav"><button class="lb-btn" id="lbPrev" aria-label="Previous">&lsaquo;</button><button class="lb-btn" id="lbNext" aria-label="Next">&rsaquo;</button></div></div>
</div>
<script>
let PHOTOS=[], CATS=[], SUBS={}, activeCat='All', activeSub='All', current=0, view=[];
const grid=document.getElementById('grid'), menu=document.getElementById('menu'),
      crumb=document.getElementById('crumb'), navcount=document.getElementById('navcount'), fcount=document.getElementById('fcount'),
      drawer=document.getElementById('drawer'), scrim=document.getElementById('scrim'), menubtn=document.getElementById('menubtn');

/* ---------- drawer open/close ---------- */
function openDrawer(){drawer.classList.add('open');scrim.classList.add('open');menubtn.setAttribute('aria-expanded','true');drawer.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';}
function closeDrawer(){drawer.classList.remove('open');scrim.classList.remove('open');menubtn.setAttribute('aria-expanded','false');drawer.setAttribute('aria-hidden','true');document.body.style.overflow='';}
menubtn.onclick=openDrawer;
document.getElementById('drawerClose').onclick=closeDrawer;
scrim.onclick=closeDrawer;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&drawer.classList.contains('open'))closeDrawer();});

/* ---------- menu build ---------- */
function hasToken(){try{return !!localStorage.getItem('jk_token');}catch(e){return false;}}
function catGroup(name,subs){
  const wrap=document.createElement('div');wrap.className='mgroup';wrap.dataset.cat=name;
  const row=document.createElement('div');row.className='mrow';
  const item=document.createElement('button');item.className='mitem';item.textContent=name;item.onclick=()=>selectCat(name);
  row.appendChild(item);
  if(subs&&subs.length){
    const tog=document.createElement('button');tog.className='mtog';tog.setAttribute('aria-label','Toggle '+name+' subcategories');tog.textContent='▸';
    tog.onclick=e=>{e.stopPropagation();wrap.classList.toggle('open');};
    row.appendChild(tog);
  }
  wrap.appendChild(row);
  if(subs&&subs.length){
    const sl=document.createElement('div');sl.className='msub';
    subs.forEach(s=>{const b=document.createElement('button');b.className='msubitem';b.textContent=s;b.dataset.cat=name;b.dataset.sub=s;b.onclick=()=>selectSub(name,s);sl.appendChild(b);});
    wrap.appendChild(sl);
  }
  return wrap;
}
function buildMenu(){
  menu.innerHTML='';
  menu.appendChild(catGroup('All',null));
  CATS.forEach(c=>menu.appendChild(catGroup(c,SUBS[c]||[])));
  document.getElementById('menuAdmin').hidden=!hasToken();
  updateMenuActive();
}
function updateMenuActive(){
  menu.querySelectorAll('.mgroup').forEach(g=>{
    const isCat=g.dataset.cat===activeCat;
    g.classList.toggle('active',isCat&&activeSub==='All');
    if(isCat&&(SUBS[activeCat]||[]).length)g.classList.add('open');
    g.querySelectorAll('.msubitem').forEach(b=>b.classList.toggle('active',b.dataset.cat===activeCat&&b.dataset.sub===activeSub));
  });
  crumb.innerHTML=activeCat==='All'?'All':(activeSub!=='All'?`${activeCat} <span class="sub">&middot; ${activeSub}</span>`:activeCat);
}
function selectCat(c){activeCat=c;activeSub='All';render();updateMenuActive();closeDrawer();}
function selectSub(c,s){activeCat=c;activeSub=s;render();updateMenuActive();closeDrawer();}

/* ---------- gallery render ---------- */
function render(){
  view=PHOTOS.filter(p=>{
    if(activeCat!=='All'&&p.cat!==activeCat)return false;
    if(activeSub!=='All'&&(p.subcat||'')!==activeSub)return false;
    return true;});
  grid.innerHTML='';
  view.forEach((p,idx)=>{const fig=document.createElement('figure');fig.className='card';
    const meta=p.subcat?`${p.cat} · ${p.subcat}`:p.cat;
    fig.innerHTML=`<img loading="lazy" src="${p.thumb}" alt="${p.title}"><figcaption><div class="cap-title">${p.title}</div><div class="cap-cat">${meta}</div></figcaption>`;
    fig.onclick=()=>openLb(idx);grid.appendChild(fig);});
  const n=view.length;
  navcount.textContent=n+' image'+(n===1?'':'s');
  fcount.textContent=n+' / '+PHOTOS.length+' images';
}

/* ---------- lightbox (unchanged) ---------- */
const lb=document.getElementById('lb'),lbImg=document.getElementById('lbImg'),lbTitle=document.getElementById('lbTitle'),lbMeta=document.getElementById('lbMeta');
function openLb(i){current=i;const p=view[i];lbImg.src=p.full;lbImg.alt=p.title;lbTitle.textContent=p.title;const meta=p.subcat?`${p.cat} &middot; ${p.subcat}`:p.cat;lbMeta.innerHTML=`<span class="sel">${String(i+1).padStart(2,'0')}</span> / ${String(view.length).padStart(2,'0')} &middot; ${meta}`;lb.classList.add('open');document.body.style.overflow='hidden';}
function closeLb(){lb.classList.remove('open');document.body.style.overflow='';}
function step(d){openLb((current+d+view.length)%view.length);}
document.getElementById('lbClose').onclick=e=>{e.stopPropagation();closeLb();};
document.getElementById('lbPrev').onclick=e=>{e.stopPropagation();step(-1);};
document.getElementById('lbNext').onclick=e=>{e.stopPropagation();step(1);};
lb.onclick=closeLb; /* click image, backdrop, or caption to close; nav buttons stop propagation */
document.addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')closeLb();if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1);});

/* ---------- boot ---------- */
function boot(){buildMenu();render();}
fetch('photos.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{
  CATS=d.cats||[];SUBS=d.subcats||{};
  PHOTOS=(d.items||[]).map(i=>({thumb:'thumbs/'+i.file,full:'images/'+i.file,title:i.title,cat:i.cat,subcat:i.subcat||''}));
  boot();
}).catch(e=>{grid.innerHTML='<p style="padding:20px">Could not load photos.json. The site must be served over http(s) — GitHub Pages does this automatically.</p>';});
</script></body></html>
