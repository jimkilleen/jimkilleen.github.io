<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>404 — Page Not Found · Jim Killeen Photography</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F4F2EC;--ink:#1B1A16;--muted:#7A756A;--select:#E4123A}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:"Archivo",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
     display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:22px}
.bird{display:block;line-height:0}
.bird img{width:auto;height:auto;max-width:min(520px,82vw);max-height:62vh;display:block}
.msg{font-family:"Space Mono",ui-monospace,monospace;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.msg .code{color:var(--select);font-weight:700}
.home{display:inline-block;margin-top:2px;font-family:"Space Mono",monospace;font-size:13px;letter-spacing:.03em;
      color:var(--ink);text-decoration:none;border-bottom:2px solid var(--select);padding-bottom:2px}
.home:hover{color:var(--select)}
</style></head>
<body>
  <a class="bird" href="/" aria-label="Return to the gallery">
    <img src="/assets/TwitterBird404.png" alt="404 — page not found">
  </a>
  <div>
    <div class="msg"><span class="code">404</span> &nbsp;·&nbsp; This page flew the coop</div>
    <a class="home" href="/">&larr; Back to the gallery</a>
  </div>
</body></html>
